# vozila.autouniverse.rs -> static SSG
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    server_name vozila.autouniverse.rs;

    ssl_certificate     /etc/letsencrypt/live/vozila.autouniverse.rs/fullchain.pem;
