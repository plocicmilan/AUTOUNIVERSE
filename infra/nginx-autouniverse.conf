# AutoUniverse + Tradesman Playbook — NGINX config
# Azurirano: 2026-08-08 (dodati HTTPS blokovi za sve subdomene)
# Cert za subdomene: /etc/letsencrypt/live/autouniverse.rs/
# Cert za vozila:    /etc/letsencrypt/live/vozila.autouniverse.rs/

# ---------------------------------------------------------------
# hub.autouniverse.rs -> AU Core :3000
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    server_name hub.autouniverse.rs;

    ssl_certificate     /etc/letsencrypt/live/autouniverse.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autouniverse.rs/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    client_max_body_size 10M;
}
server {
    listen 80;
    server_name hub.autouniverse.rs;
    return 301 https://$host$request_uri;
}

