# ---------------------------------------------------------------
# garage.autouniverse.rs -> static PWA
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    server_name garage.autouniverse.rs;

    ssl_certificate     /etc/letsencrypt/live/autouniverse.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autouniverse.rs/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/autouniverse/garage;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* (index\.html|sw\.js|manifest\.json)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
server {
    listen 80;
    server_name garage.autouniverse.rs;
    return 301 https://$host$request_uri;
}

