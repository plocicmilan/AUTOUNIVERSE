# ---------------------------------------------------------------
# autouniverse.rs -> landing :4000
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    server_name autouniverse.rs www.autouniverse.rs;

    ssl_certificate     /etc/letsencrypt/live/autouniverse.rs-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autouniverse.rs-0001/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location = /assets/favicon.ico {
        return 301 /assets/favicon.svg;
    }

    # URL konsolidacija kalkulatora (stari sablon -> novi)
    location = /kalkulator-registracije { return 301 /kalkulatori/registracije; }
    location = /kalkulator-uvoza        { return 301 /kalkulatori/uvoza; }
    location = /kalkulator/vin          { return 301 /kalkulatori/vin; }
    location ~ ^/kalkulator-(.+)$       { return 301 /kalkulatori/; }
    location ~ ^/kalkulator/(.+)$       { return 301 /kalkulatori/; }
    rewrite ^/(.+)/$ / permanent;
    location /downloads/ {
        root /var/www/autouniverse/landing;
        add_header Content-Disposition attachment;
        add_header Cache-Control no-store;
    }

    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    client_max_body_size 1M;
}
server {
    listen 80;
    server_name autouniverse.rs www.autouniverse.rs;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# tradesmanplaybook.com -> static sajt
# ---------------------------------------------------------------
server {
    server_name tradesmanplaybook.com www.tradesmanplaybook.com;
    root /var/www/tradesmanplaybook;
    index index.html;
    error_page 404 /404.html;

    # redirects za stare duplikate kalkulatora
    location = /calculators/ev-charger-installation/ { return 301 https://tradesmanplaybook.com/calculators/ev-charger-install/; }
    location = /calculators/generator-installation-cost/ { return 301 https://tradesmanplaybook.com/calculators/generator-install-cost/; }
    location = /calculators/smoke-detector-installation/ { return 301 https://tradesmanplaybook.com/calculators/smoke-co-detector-install/; }
    location = /calculators/duct-leak-sealing-cost/ { return 301 https://tradesmanplaybook.com/calculators/duct-sealing-cost/; }

    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|svg|woff2|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(html)$ {
        expires off;
        add_header Cache-Control "no-store";
    }

    client_max_body_size 20M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tradesmanplaybook.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradesmanplaybook.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

