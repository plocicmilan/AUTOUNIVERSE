<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1d35"/>
      <stop offset="100%" style="stop-color:#162845"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="#ff6b35"/>

  <!-- Grid dots pattern (subtle) -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.05)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left content area -->
  <!-- AU badge -->
  <rect x="80" y="90" width="64" height="64" rx="14" fill="#ff6b35"/>
  <text x="112" y="134" font-family="-apple-system,system-ui,sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">AU</text>

  <!-- Brand name -->
  <text x="160" y="124" font-family="-apple-system,system-ui,sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">AutoUniverse</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="-apple-system,system-ui,sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-2">Kompletan životni</text>
  <text x="80" y="305" font-family="-apple-system,system-ui,sans-serif" font-size="62" font-weight="800" fill="#ff6b35" letter-spacing="-2">ciklus vozila.</text>

  <!-- Subheadline -->
  <text x="80" y="365" font-family="-apple-system,system-ui,sans-serif" font-size="22" fill="#94a3b8">Driver za vlasnike · Garage za servise · Kalkulatori</text>

  <!-- Stats row -->
  <rect x="80" y="420" width="160" height="80" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="160" y="453" font-family="-apple-system,system-ui,sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">100%</text>
  <text x="160" y="477" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Offline</text>

  <rect x="260" y="420" width="160" height="80" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="340" y="453" font-family="-apple-system,system-ui,sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">0</text>
  <text x="340" y="477" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Tracking</text>

  <rect x="440" y="420" width="160" height="80" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="520" y="453" font-family="-apple-system,system-ui,sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">Free</text>
  <text x="520" y="477" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Za početnike</text>

  <!-- Domain -->
  <text x="80" y="570" font-family="-apple-system,system-ui,sans-serif" font-size="16" fill="#4A5568" letter-spacing="0.5">autouniverse.rs</text>

  <!-- Right side: app cards -->
  <rect x="800" y="80" width="320" height="180" rx="16" fill="rgba(14,165,233,0.1)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="830" y="130" font-family="-apple-system,system-ui,sans-serif" font-size="14" font-weight="600" fill="#0ea5e9">DRIVER TOOLBOX</text>
  <text x="830" y="158" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Servisna knjižica · Troškovi</text>
  <text x="830" y="178" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Podsetnici · PDF dosije</text>
  <text x="830" y="198" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Backup / Restore</text>
  <!-- Car emoji approximation -->
  <text x="1070" y="200" font-family="-apple-system,system-ui,sans-serif" font-size="42" fill="white">🚗</text>

  <rect x="800" y="285" width="320" height="180" rx="16" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.25)" stroke-width="1"/>
  <text x="830" y="335" font-family="-apple-system,system-ui,sans-serif" font-size="14" font-weight="600" fill="#ef4444">GARAGE TOOLBOX</text>
  <text x="830" y="363" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Radni nalozi · PDF račun</text>
  <text x="830" y="383" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Katalog delova · DVI inspekcija</text>
  <text x="830" y="403" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#64748b">Klijentska knjižica</text>
  <text x="1070" y="405" font-family="-apple-system,system-ui,sans-serif" font-size="42" fill="white">🔧</text>

  <!-- Connect line -->
  <line x1="960" y1="265" x2="960" y2="285" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="960" cy="275" r="4" fill="#ff6b35"/>

  <!-- Bottom badge -->
  <rect x="800" y="490" width="320" height="60" rx="12" fill="rgba(255,107,53,0.12)" stroke="rgba(255,107,53,0.3)" stroke-width="1"/>
  <text x="960" y="524" font-family="-apple-system,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="middle">🇷🇸 Napravljeno u Srbiji · Radi offline</text>
</svg>
